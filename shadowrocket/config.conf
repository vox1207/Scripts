weibo-intl-ad = type=http-response,requires-body=true,pattern=^https?:\/\/weibointl\.api\.weibo\.cn\/portal\.php\?a=open_app,script-path=https://raw.githubusercontent.com/ddgksf2013/Scripts/refs/heads/master/weibo_json.js
